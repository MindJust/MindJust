<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MindJust — Curiosity, made tangible</title>
  <desc id="desc">A warm editorial banner with expressive terracotta botanical linework and serif typography.</desc>

  <defs>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#8C7665" opacity=".13"/>
      <circle cx="17" cy="19" r=".55" fill="#8C7665" opacity=".10"/>
    </pattern>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D77B5D"/>
      <stop offset="1" stop-color="#B94F37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#F4F0E8"/>
  <rect width="1200" height="420" fill="url(#paper)"/>
  <path d="M42 34H1158M42 386H1158" stroke="#D8CFC2" stroke-width="1"/>
  <path d="M42 34V386M1158 34V386" stroke="#D8CFC2" stroke-width="1"/>

  <circle cx="1084" cy="72" r="4" fill="#C05B42"/>
  <text x="1102" y="77" fill="#806D60" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">LOMÉ, TG</text>

  <text x="76" y="211" fill="#302923" font-family="Georgia, 'Times New Roman', serif" font-size="105" letter-spacing="-5">MindJust<tspan fill="#C05B42">.</tspan></text>
  <text x="84" y="264" fill="#6E5B4E" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-style="italic">Curiosity, made tangible.</text>
  <path d="M84 300H470" stroke="#C05B42" stroke-width="2"/>

