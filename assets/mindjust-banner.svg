<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">MINDJUST — Order is a material</title>
<desc id="d">A dark Swiss grid disrupted by a generative field and a distorted MINDJUST wordmark.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#777" stroke-opacity=".23" stroke-width="1"/></pattern>
  <filter id="rough" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency=".018 .12" numOctaves="2" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <linearGradient id="fade"><stop stop-color="#C7F000" stop-opacity=".9"/><stop offset="1" stop-color="#C7F000" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="420" fill="#101010"/>
<rect width="1200" height="420" fill="url(#grid)"/>
<g fill="none" stroke="#C7F000" stroke-width="1" opacity=".55">
 <path d="M760 0V420M800 0V420M840 0V420M880 0V420M920 0V420M960 0V420M1000 0V420M1040 0V420M1080 0V420M1120 0V420"/>
 <path d="M720 40H1200M720 80H1200M720 120H1200M720 160H1200M720 200H1200M720 240H1200M720 280H1200M720 320H1200M720 360H1200"/>
</g>
<g fill="#F1EFE7" font-family="Arial,Helvetica,sans-serif">
 <text x="64" y="54" font-size="13" letter-spacing="4">INDEPENDENT MIND / GENERATIVE DESIGN SYSTEM</text>
 <text x="64" y="180" font-size="108" font-weight="900" letter-spacing="-8" filter="url(#rough)">MINDJUST</text>
 <text x="68" y="224" font-family="monospace" font-size="15" letter-spacing="3">ORDER IS A MATERIAL.</text>
 <text x="68" y="370" font-family="monospace" font-size="11" letter-spacing="2" fill="#777">AI × SOFTWARE × GENERATIVE ART</text>
 <text x="1136" y="370" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="end" fill="#777">LOMÉ / TG — 2026</text>
</g>
<g opacity=".95">
 <path d="M720 95C820 20 900 180 1000 90S1120 20 1200 100" fill="none" stroke="url(#fade)" stroke-width="2"/>
 <path d="M720 115C820 40 900 200 1000 110S1120 40 1200 120" fill="none" stroke="#C7F000" stroke-width="1"/>
 <path d="M720 135C820 60 900 220 1000 130S1120 60 1200 140" fill="none" stroke="#C7F000" stroke-opacity=".65" stroke-width="1"/>
 <path d="M720 155C820 80 900 240 1000 150S1120 80 1200 160" fill="none" stroke="#C7F000" stroke-opacity=".4" stroke-width="1"/>
</g>
<g fill="#FF3B30"><circle cx="1080" cy="280" r="5"/><circle cx="1120" cy="280" r="2"/><circle cx="1160" cy="280" r="5"/></g>
<path d="M64 250H1136" stroke="#F1EFE7" stroke-opacity=".28"/>
<text x="1136" y="54" fill="#C7F000" font-family="monospace" font-size="12" text-anchor="end" letter-spacing="2">STUDY / 001</text>
</svg>