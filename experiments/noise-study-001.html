<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>MINDJUST® — Noise Study 001</title>
<style>
:root{color-scheme:dark;--bg:#101010;--paper:#f1efe7;--lime:#c7f000;--red:#ff3b30;--muted:#858585;--line:#393939}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper)}
body{font-family:Arial,Helvetica,sans-serif;padding:clamp(16px,3vw,40px)}
.shell{max-width:1440px;margin:auto;min-height:calc(100svh - 2 * clamp(16px,3vw,40px));display:flex;flex-direction:column}
header,.meta,footer{display:flex;justify-content:space-between;align-items:center;gap:16px}
header{padding-bottom:18px;border-bottom:1px solid var(--line);font:10px/1.5 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
.brand{font:800 16px Arial,sans-serif;letter-spacing:-.055em}.lime{color:var(--lime)}main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,5vh,56px) 0 26px}
.kicker{font:10px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.stage{position:relative;border:1px solid var(--line);background:#0b0b0b;overflow:hidden}
canvas{width:100%;height:clamp(230px,39vw,470px);display:block;touch-action:pan-y}
.meta{font:9px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:10px}
.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr auto;gap:14px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);align-items:end}
.control label{display:flex;justify-content:space-between;gap:8px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
output{color:var(--paper)}input[type=range]{width:100%;accent-color:var(--lime);cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:7px}
button{border:1px solid #555;background:transparent;color:var(--paper);padding:10px 12px;font:9px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover,button[aria-pressed=true]{border-color:var(--lime);color:var(--lime)}
button.primary{background:var(--lime);border-color:var(--lime);color:var(--bg)}
button.primary:hover{background:var(--paper);border-color:var(--paper)}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 0}
footer{padding-top:16px;font:9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}.hide-small{display:none}canvas{height:58vw;min-height:210px}}
@media(prefers-reduced-motion:reduce){canvas{touch-action:manipulation}}
</style>
</head>
<body>
<div class="shell">
<header><div><div class="brand">MINDJUST<span class="lime">®</span></div><div>Generative identity system</div></div><div>EXP.001 / NOISE STUDY</div><div class="hide-small">FORM IS NEVER <span class="lime">FINAL.</span></div></header>
<main>
<div class="kicker">01 / Wordmark as material — particle displacement</div>
<div class="stage"><canvas id="art" role="img" aria-label="Generative particle wordmark MINDJUST"></canvas></div>
<div class="meta"><span>Seed <output id="seedRead">42817</output> / Canvas 2D</span><span>Move pointer to disturb the signal</span></div>
</main>
<section class="controls" aria-label="Generative controls">
<div class="control"><label for="intensity">Distortion <output id="intensityRead">68%</output></label><input id="intensity" type="range" min="0" max="100" value="68"></div>
<div class="control"><label for="density">Density <output id="densityRead">72%</output></label><input id="density" type="range" min="20" max="100" value="72"></div>
<div class="control"><label for="speed">Motion <output id="speedRead">45%</output></label><input id="speed" type="range" min="0" max="100" value="45"></div>
<div class="actions"><button id="pause" aria-pressed="false">Pause</button><button id="random">New seed ↗</button><button id="export" class="primary">Export PNG ↓</button></div>
</section>
<div class="presets" aria-label="Presets"><button data-preset="signal" aria-pressed="false">01 / Signal</button><button data-preset="unstable" aria-pressed="true">02 / Unstable</button><button data-preset="dissolve" aria-pressed="false">03 / Dissolve</button><button data-preset="ghost" aria-pressed="false">04 / Ghost</button></div>
<footer><span><span class="lime">●</span> VOID BLACK / ACID LIME</span><span>Generative study / 2026</span><span>MINDJUST — DIGITAL EXPERIMENTS</span></footer>
</div>
<script>
(()=> {
const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const controls={intensity:$('intensity'),density:$('density'),speed:$('speed')};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,seed=42817,particles=[],frame=0,running=!reduced,raf=0;
let pointer={x:-9999,y:-9999,active:false};
const presets={
 signal:{intensity:28,density:88,speed:24},
 unstable:{intensity:68,density:72,speed:45},
 dissolve:{intensity:96,density:43,speed:72},
 ghost:{intensity:52,density:32,speed:12}
};
function rng(s){let n=s>>>0;return()=>{n=(n*1664525+1013904223)>>>0;return n/4294967296}}
function updateReadouts(){for(const k in controls)$(k+'Read').textContent=controls[k].value+'%'}
function build(){
 const rect=canvas.getBoundingClientRect();W=Math.max(1,rect.width);H=Math.max(1,rect.height);DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
 const mask=document.createElement('canvas');mask.width=Math.ceil(W);mask.height=Math.ceil(H);
 const m=mask.getContext('2d',{willReadFrequently:true});m.clearRect(0,0,W,H);
 const fs=Math.min(W*.17,H*.66);m.font='900 '+fs+'px Arial, Helvetica, sans-serif';m.textAlign='center';m.textBaseline='middle';m.fillStyle='#fff';
 m.fillText('MINDJUST',W/2,H/2+fs*.035);
 const pixels=m.getImageData(0,0,mask.width,mask.height).data,rand=rng(seed),step=W<620?2.7:3.1,keep=Number(controls.density.value)/100;
 particles=[];
 for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
  const ix=Math.floor(y)*mask.width+Math.floor(x);
  if(pixels[ix*4+3]>100&&rand()<keep)particles.push({x,y,phase:rand()*Math.PI*2,size:.45+rand()*1.15,amp:.4+rand()*1.2,grain:rand(),tone:rand()});
 }
 $('seedRead').textContent=seed;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const power=Number(controls.intensity.value)/100,velocity=Number(controls.speed.value)/100;
 const time=frame*(reduced?0:.016*(.15+velocity*1.8));
 for(const p of particles){
  const wave=Math.sin(p.x*.021+time*1.7+p.phase),grain=Math.sin(p.y*.043-time*2.1+p.phase*2);
  let dx=wave*power*17*p.amp+Math.sin(time+p.phase)*power*5;
  let dy=grain*power*12*p.amp+Math.cos(time*.7+p.phase)*power*3;
  if(pointer.active){const px=p.x-pointer.x,py=p.y-pointer.y,d=Math.hypot(px,py);if(d<125&&d>0.01){const f=(1-d/125)*power*34;dx+=px/d*f;dy+=py/d*f}}
  const shimmer=.68+.32*Math.sin(time*2+p.phase);
  ctx.globalAlpha=(.28+p.grain*.72)*shimmer;
  ctx.fillStyle=p.tone>.965?'#f1efe7':'#c7f000';
  const size=p.size*(1+power*p.grain*.65);
  ctx.fillRect(p.x+dx,p.y+dy,size,size);
 }
 ctx.globalAlpha=1;frame++;
 if(running)raf=requestAnimationFrame(draw);
}
function restart(){cancelAnimationFrame(raf);draw()}
function newSeed(){seed=Math.floor(Math.random()*90000)+10000;frame=0;build();restart()}
function setPreset(name){const p=presets[name];for(const k in p)controls[k].value=p[k];document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===name)));updateReadouts();build();restart()}
Object.values(controls).forEach(el=>el.addEventListener('input',()=>{updateReadouts();if(el===controls.density){build()}restart()}));
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.preset)));
$('random').addEventListener('click',newSeed);
$('pause').addEventListener('click',()=>{running=!running;$('pause').textContent=running?'Pause':'Resume';$('pause').setAttribute('aria-pressed',String(!running));if(running)draw();else cancelAnimationFrame(raf)});
$('export').addEventListener('click',()=>{
 const a=document.createElement('a');a.download='mindjust-noise-'+seed+'.png';a.href=canvas.toDataURL('image/png');a.click();
});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top,active:true};if(!running)restart()});
canvas.addEventListener('pointerleave',()=>{pointer.active=false;if(!running)restart()});
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{build();restart()},120)});
updateReadouts();build();draw();
})();
</script>
</body>
</html>
